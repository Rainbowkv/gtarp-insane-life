<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="reset.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="./jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>ravens-Multicharacter</title>
</head>
    <body>
        <audio id="click" src="./click.wav"></audio>
        <audio id="musica_fondo" src="./musica.mp3" loop></audio>
        <div class="container">     
            <div class="main-screen">
                <div class="fondocolor"></div>
                <div class="topbar" style="display: block; top: 0%;"></div>
                <img class="imagenlogo" style="display: none; top: 50%;" src="">
                <div class="bottombar" style="display: block; top: 50%;"></div> 

                <div class="welcomescreen">
                    <div class="loading-rondje">
                        <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
                        <p id="loading-text">加载角色</p>
                    </div>
                </div>
                <div class="title-screen">
                    <div class="fondo-negro"></div>
                    <div class="contenedor">
                        <div class="btn-iniciar">开始</div>
                    </div>
                </div>
                <div class="jugadores-on" id="total-players">玩家</div> 
                <div class="characters-list">
                </div>

                <div class="character-info">
                    <div class="char-info-titel"><i class="material-icons" id="char-info-icon">info</i><span id="char-info-titel">角色信息</span></div>
                    <div class="character-info-valid">
                        <span id="no-char">请选择一个角色以查看所有相关信息。</span>
                    </div>
                </div>

                <div class="character-register">
                    <div class="characters-register-block-header">
                        <p>角色注册</p>
                        <i class="material-icons-one" id="close-reg">close</i>
                    </div>
                    <div class="char-register-inputs">
                        <input type="text" id="first_name" placeholder="名字" class="char-reg-input">
                        <input type="text" id="last_name" placeholder="姓氏" class="char-reg-input">
                        <input type="text" id="nationality" placeholder="国籍" class="char-reg-input">
                        <input type="date" id="birthdate" placeholder="出生日期" min="1900-01-01" max="2999-12-31" class="char-reg-input">
                        <select id="gender" name="gender">
                            <option value="Male" selected>男</option>
                            <option value="Female">女</option>
                        </select>
                    </div>
                    <div class="character-reg-btn" id="create"><p id="create-text">确认</p></div>
                </div>

                <div class="character-delete">
                    <div class="characters-delete-block-header">
                        <p>删除角色</p>
                    </div>

                    <p>确定要删除您的角色吗？</p>

                    <div class="character-acceptdel-btn" id="accept-delete"><p id="accept-text">确认</p></div>
                    <div class="character-canceldel-btn" id="cancel-delete"><p id="cancel-text">返回</p></div>
                </div>
            </div>
        </div>
    </body>
    <script type="text/javascript" src="profanity.js"></script>
    <script type="text/javascript" src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</html>
